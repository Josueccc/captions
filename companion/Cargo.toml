[package]
name = "auris-companion"
version = "0.3.0"
edition = "2024"
description = "Native-messaging host that streams Firefox's audio output to the Auris extension"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
base64 = "0.22"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }
windows-registry = "0.6"

[profile.release]
opt-level = "s"
lto = true
strip = true
