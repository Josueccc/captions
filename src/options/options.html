<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Captions settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Captions settings</h1>
      <form id="form">
        <label>
          <span>Audio language</span>
          <select id="language"></select>
        </label>
        <label>
          <span>Transcription provider</span>
          <select id="provider"></select>
          <small id="provider-description"></small>
        </label>
        <fieldset id="provider-fields"></fieldset>
        <label>
          <span>Audio source</span>
          <select id="audio-source">
            <option value="auto">Automatic: the video, or the companion for DRM videos</option>
            <option value="page">The video on the page</option>
            <option value="tab">Companion: this tab's audio</option>
            <option value="system">Companion: all system audio</option>
          </select>
          <small>
            DRM-protected videos (Netflix, Disney+, Prime…) can't be read from the page; the
            system-audio companion records them from the sound output instead. Install it once with
            companion/install.sh (Linux with PipeWire).
          </small>
        </label>
        <label class="check">
          <input type="checkbox" id="debug" />
          <span>Show caption latency (debug)</span>
        </label>
        <div class="actions">
          <button type="submit">Save</button>
          <span id="saved" hidden>Saved ✓</span>
        </div>
      </form>
      <p class="note">
        Settings apply the next time you start captions. API keys are stored only in this browser's
        extension storage.
      </p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
