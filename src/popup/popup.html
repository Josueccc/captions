<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon.svg" alt="" width="20" height="20" />
      <h1 data-i18n="extensionName">Captions</h1>
    </header>
    <p id="summary" class="muted"></p>
    <p id="message"></p>
    <a id="help" href="#" hidden></a>
    <button id="grant" hidden data-i18n="popupGrant">Allow access to websites</button>
    <button id="toggle" disabled data-i18n="popupStart">Start captions</button>
    <footer>
      <a href="#" id="options" data-i18n="popupSettings">Settings</a>
      <span class="muted">Alt+Shift+C</span>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
